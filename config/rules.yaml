# ---------------------------------------------------------------------------
# 불법사이트 판별 규칙
#
# 점수 계산 방식
#   최종점수 = base_score
#            + 링크 텍스트/배너 alt 키워드 점수 (anchor_weight 배)
#            + 링크 주변 문맥 키워드 점수 (context_weight 배)
#            + 도메인 패턴 점수
#            + 의심 TLD 점수
#            + 여러 홍보사이트에서 중복 발견 시 보너스 (아래 cross_source_bonus)
#   -> 0~100 으로 절단
#
# 카테고리는 점수가 가장 높은 쪽으로 결정됩니다.
# 운영하면서 오탐/미탐이 보이면 이 파일만 수정하면 됩니다(코드 수정 불필요).
# ---------------------------------------------------------------------------

scoring:
  # 홍보사이트에서 외부로 나가는 링크라는 사실 자체의 기본 점수
  base_score: 15
  anchor_weight: 1.0
  context_weight: 0.35
  # 서로 다른 홍보사이트 N곳에서 발견될 때마다 더해지는 점수 (최대치 포함)
  cross_source_bonus_per_source: 6
  cross_source_bonus_max: 24
  # 한 카테고리에서 키워드로 얻을 수 있는 최대 점수
  keyword_score_cap: 60

thresholds:
  # 이 점수 이상이면 "불법사이트 후보"로 저장
  candidate: 25
  # 이 점수 이상이면 엑셀에서 '높음'으로 표시
  high: 65

