# 도메인 자체의 형태로 판단하는 휴리스틱 (정규식, 등록가능도메인에 매칭)
domain_patterns:
  - pattern: '^[a-z]{2,12}-?(?:777|888|999|365|24|100|1004)\.'
    score: 12
    reason: "숫자 조합 도메인"
  - pattern: '(?:casino|baccara|baccarat|slot|toto|bet|bett|betting|gamble)'
    score: 20
    reason: "도박 관련 영문 도메인"
  - pattern: '(?:porn|sex|xxx|adult|av19|yadong)'
    score: 20
    reason: "성인 관련 영문 도메인"
  - pattern: '(?:webtoon|toon|movie|drama|tv|link|juso)\d'
    score: 10
    reason: "저작권침해 의심 도메인"
  - pattern: '^[a-z]{1,4}\d{2,6}\.'
    score: 10
    reason: "짧은 영문+숫자 도메인(대량 생성 의심)"
  - pattern: '-(?:kr|kor|korea)\d*\.'
    score: 6
    reason: "국가 접미사 조합"

