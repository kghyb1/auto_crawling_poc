    - jquery.org
    - wikipedia.org
    - police.go.kr
    - kcsc.or.kr
    - kocsc.or.kr
    - go.kr
    - gov.kr
  # 등록가능도메인이 이 문자열로 끝나면 제외 (CDN/광고망 등)
  domain_suffixes:
    - .gov
    - .edu
    - .mil
    - .go.kr
    - .ac.kr
    - .or.kr
  # URL 이 이 정규식에 걸리면 제외 (이미지/스크립트/공유버튼 등)
  url_patterns:
    - '\.(?:png|jpe?g|gif|webp|svg|ico|css|js|woff2?|ttf|eot|mp4|webm|mp3|zip|pdf)(?:\?|$)'
    - '^https?://[^/]+/(?:robots\.txt|sitemap[^/]*\.xml)'
    - '(?:facebook|twitter|x)\.com/(?:sharer|share|intent)'
    - '^mailto:'
    - '^tel:'
    - '^javascript:'
