    - tistory.com
    - blogspot.com
    - wordpress.org
    - wordpress.com
    - w3.org
    - schema.org
    - jquery.com
    - jsdelivr.net
    - cloudflare.com
    - cloudflareinsights.com
    - bootstrapcdn.com
    - unpkg.com
    - cdnjs.com
    - fontawesome.com
    - github.com
    - github.io
    - microsoft.com
    - apple.com
